name: CI

on:
  pull_request:
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The stdlib-only, 3.9+ floor is a real constraint, so test both ends of it.
        python-version: ['3.9', '3.x']
    name: test (python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Show interpreter
        run: python3 --version
      - name: Run test suite
        run: python3 test_akashic.py
